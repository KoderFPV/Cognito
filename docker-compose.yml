version: "3.8"

services:
  mongo:
    image: mongo:7
    container_name: cognito-mongo
    ports:
      - "2138:27017"
    environment:
      - MONGO_INITDB_DATABASE=cognito
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  weaviate:
    image: docker.io/semitechnologies/weaviate:1.30.1
    restart: on-failure:0
    ports:
      - "2139:8080"
      - "2140:50051"
    volumes:
      - ./weaviate-data:/var/lib/weaviate
    environment:
      LOG_LEVEL: "debug"
      QUERY_DEFAULTS_LIMIT: 1000
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      ENABLE_MODULES: "multi2vec-clip, text2vec-transformers, backup-filesystem"
      BACKUP_FILESYSTEM_PATH: "/var/lib/weaviate/backups"
      CLUSTER_HOSTNAME: "node1"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "false"
      AUTHENTICATION_APIKEY_ENABLED: "true"
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: "cognito-key,devs-key"
      AUTHENTICATION_APIKEY_USERS: "cognito,devs"
      AUTHORIZATION_RBAC_ENABLED: "true"
      AUTHORIZATION_RBAC_ROOT_USERS: "cognito"
      AUTHENTICATION_DB_USERS_ENABLED: "true"
      CLIP_INFERENCE_API: "http://multi2vec-clip:8080"
      TRANSFORMERS_INFERENCE_API: "http://text2vec-snowflake:8080"

  multi2vec-clip:
    image: cr.weaviate.io/semitechnologies/multi2vec-clip:sentence-transformers-clip-ViT-B-32-multilingual-v1

  text2vec-snowflake:
    image: kodercloud/snowflake-l-2-0-weaviate

  ollama:
    image: ollama/ollama
    ports:
      - "2141:11434"
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  mongo-data:
  weaviate-data:
  ollama-data:
